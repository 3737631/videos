name: yt-dlp probe
on:
  workflow_dispatch:
    inputs:
      url:
        description: YouTube URL/ID to probe
        required: true
        default: "9FDVvWR91ww"
    workflow_call:
      inputs:
        url:
          type: string
          required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install yt-dlp
        run: |
          pip install -U yt-dlp
          yt-dlp --version
      - name: Probe GET-URL (bare)
        id: probe
        continue-on-error: true
        run: |
          set +e
          OUT=$(yt-dlp --get-url --skip-download -f "bv*+ba/b" "https://www.youtube.com/watch?v=${{ inputs.url }}" 2>&1)
          CODE=$?
          echo "BARE_EXIT=$CODE"
          echo "$OUT" | grep -iE "LOGIN_REQUIRED|UNPLAYABLE|Sign in|not available|Precondition|GOT|^https" | head -10
      - name: Try WARP + retry
        continue-on-error: true
        run: |
          YT_URL="https://www.youtube.com/watch?v=${{ inputs.url }}"
          # Descargar warp desde el pool noble de Cloudflare SIN instalar deps GUI (apt falla por mirrors)
          curl -fsSL "https://pkg.cloudflareclient.com/pool/noble/main/c/cloudflare-warp/cloudflare-warp_2026.7.1377.0_amd64.deb" -o /tmp/warp.deb || true
          ls -la /tmp/warp.deb 2>/dev/null || true
          if [ -s /tmp/warp.deb ]; then
            sudo dpkg-deb -x /tmp/warp.deb /tmp/warp
          fi
          WSBIN=""
          for P in /tmp/warp/bin /tmp/warp/usr/bin; do
            if [ -x "$P/warp-svc" ]; then WSBIN="$P"; break; fi
          done
          echo "WSBIN=$WSBIN"
          echo "WARP LDD warp-svc:"
          ldd "$WSBIN/warp-svc" 2>&1 | grep -i "not found" || echo "all libs present"
          # En runners GH no hay systemd: arrancar el daemon manualmente desde la ruta extraida
          sudo pkill -f warp-svc || true
          sudo "$WSBIN/warp-svc" >/tmp/warp-svc.log 2>&1 &
          sleep 8
          echo "WARP SVC PROCS:"
          pgrep -af warp-svc | head -5 || true
          echo "WARP SVC LOG (primeras lineas):"
          tail -5 /tmp/warp-svc.log 2>/dev/null || true
          sudo "$WSBIN/warp-cli" --accept-tos registration new >/dev/null 2>&1 || true
          sudo "$WSBIN/warp-cli" --accept-tos mode proxy >/dev/null 2>&1 || true
          sudo "$WSBIN/warp-cli" --accept-tos connect >/dev/null 2>&1 || true
          echo "WARP STATUS:"
          sudo "$WSBIN/warp-cli" --accept-tos status 2>&1 | head -8 || true
          sleep 6
          echo "WARP SOCK:"
          sudo ss -tlnp | grep -i 40000 || true
          echo "WARP EXIT TRACE:"
          timeout 20 curl -s --proxy socks5h://127.0.0.1:40000 https://1.1.1.1/cdn-cgi/trace || echo "socks dead"
          set +e
          rm -f /tmp/urls.txt
          try_client() {
            CLIENT="$1"
            if [ "$CLIENT" = "default" ]; then
              ARGS=""
            else
              ARGS="--extractor-args youtube:player_client=$CLIENT"
            fi
            OUT=$(yt-dlp -v $ARGS --proxy "socks5h://127.0.0.1:40000" --get-url --skip-download -f "bv*+ba/b" "$YT_URL" 2>&1)
            CODE=$?
            URL=$(echo "$OUT" | grep -E "^https" | head -1)
            STATUS=$(echo "$OUT" | grep -oE "playability status: [A-Z_]+" | head -1)
            echo "CLIENT $CLIENT => exit=$CODE status=$STATUS url=${URL:0:70}"
            if [ -n "$URL" ]; then echo "$CLIENT|$URL" >> /tmp/urls.txt; fi
          }
          try_client default
          try_client android_vr
          try_client android
          echo "== verbose detalle primer cliente =="
          OUT0=$(yt-dlp -v --proxy "socks5h://127.0.0.1:40000" --get-url --skip-download -f "bv*+ba/b" "$YT_URL" 2>&1)
          echo "$OUT0" | grep -iE "\[debug\] \[youtube\]|playability|nsig|po_token|ExtractorError|player_client" | head -30
          LINE=$(head -1 /tmp/urls.txt 2>/dev/null || true)
          if [ -n "$LINE" ]; then
            CL="${LINE%%|*}"
            URL="${LINE#*|}"
            echo "YT_RESULT url=$URL client=$CL"
          else
            echo "YT_RESULT none"
          fi
      - name: Print result
        run: |
          echo "URLs por cliente:"
          cat /tmp/urls.txt 2>/dev/null || echo "none"