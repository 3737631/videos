name: yt-dlp probe
on:
  workflow_dispatch:
    inputs:
      url:
        description: YouTube URL/ID to probe
        required: true
        default: "9FDVvWR91ww"
    workflow_call:
      inputs:
        url:
          type: string
          required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Install yt-dlp
        run: |
          pip install -U yt-dlp
          yt-dlp --version
      - name: Probe GET-URL (bare)
        id: probe
        continue-on-error: true
        run: |
          set +e
          OUT=$(yt-dlp --get-url --skip-download -f "bv*+ba/b" "https://www.youtube.com/watch?v=${{ inputs.url }}" 2>&1)
          CODE=$?
          echo "BARE_EXIT=$CODE"
          echo "$OUT" | grep -iE "LOGIN_REQUIRED|UNPLAYABLE|Sign in|not available|Precondition|GOT|^https" | head -10
      - name: Try WARP + retry
        continue-on-error: true
        run: |
          # WARP via contenedor linuxserver/warp (expone SOCKS5 127.0.0.1:40000), sin dependencias de paquetes
          docker run -d --name=warp --cap-add=NET_ADMIN --cap-add=SYS_MODULE \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -e PUID=1000 -e PGID=1000 -e TZ=Etc/UTC -p 40000:40000 \
            lscr.io/linuxserver/warp || true
          sleep 20
          echo "WARP CONTAINER:"
          docker ps --filter name=warp --format "{{.Status}}" || true
          echo "WARP SOCK:"
          sudo ss -tlnp | grep -i 40000 || true
          set +e
          OUT=$(yt-dlp --proxy "socks5://127.0.0.1:40000" --get-url --skip-download -f "bv*+ba/b" "https://www.youtube.com/watch?v=${{ inputs.url }}" 2>&1)
          CODE=$?
          echo "WARP_EXIT=$CODE"
          echo "$OUT" | grep -iE "LOGIN_REQUIRED|UNPLAYABLE|Sign in|not available|Precondition|^https" | head -10
          echo "$OUT" | grep -E "^https" | head -1 > /tmp/url.txt
      - name: Print result
        run: |
          echo "Result URL:"
          cat /tmp/url.txt 2>/dev/null || echo "none"