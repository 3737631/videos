name: yt-dlp probe
on:
  workflow_dispatch:
    inputs:
      url:
        description: YouTube URL/ID to probe
        required: true
        default: "9FDVvWR91ww"
    workflow_call:
      inputs:
        url:
          type: string
          required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Install yt-dlp
        run: |
          pip install -U yt-dlp
          yt-dlp --version
      - name: Probe GET-URL (bare)
        id: probe
        continue-on-error: true
        run: |
          set +e
          OUT=$(yt-dlp --get-url --skip-download -f "bv*+ba/b" "https://www.youtube.com/watch?v=${{ inputs.url }}" 2>&1)
          CODE=$?
          echo "BARE_EXIT=$CODE"
          echo "$OUT" | grep -iE "LOGIN_REQUIRED|UNPLAYABLE|Sign in|not available|Precondition|GOT|^https" | head -10
      - name: Try WARP + retry
        continue-on-error: true
        run: |
          # Instalar warp-cli desde el pool noble de Cloudflare (sin depender de ghcr ni repos apt)
          curl -fsSL "https://pkg.cloudflareclient.com/pool/noble/main/c/cloudflare-warp/cloudflare-warp_2026.7.1377.0_amd64.deb" -o /tmp/warp.deb || true
          ls -la /tmp/warp.deb 2>/dev/null || true
          if [ -s /tmp/warp.deb ]; then
            sudo dpkg -i /tmp/warp.deb || sudo apt-get install -y -f
          fi
          # En runners GH no hay systemd: arrancar el daemon manualmente
          sudo pkill -f warp-svc || true
          sudo /usr/bin/warp-svc >/tmp/warp-svc.log 2>&1 &
          sleep 8
          echo "WARP SVC PROCS:"
          pgrep -af warp-svc | head -5 || true
          sudo warp-cli --accept-tos registration new >/dev/null 2>&1 || true
          sudo warp-cli --accept-tos mode proxy >/dev/null 2>&1 || true
          sudo warp-cli --accept-tos connect >/dev/null 2>&1 || true
          echo "WARP STATUS:"
          sudo warp-cli status 2>&1 | head -8 || true
          sleep 6
          echo "WARP SOCK:"
          sudo ss -tlnp | grep -i 40000 || true
          set +e
          OUT=$(yt-dlp --proxy "socks5://127.0.0.1:40000" --get-url --skip-download -f "bv*+ba/b" "https://www.youtube.com/watch?v=${{ inputs.url }}" 2>&1)
          CODE=$?
          echo "WARP_EXIT=$CODE"
          echo "$OUT" | grep -iE "LOGIN_REQUIRED|UNPLAYABLE|Sign in|not available|Precondition|^https" | head -10
          echo "$OUT" | grep -E "^https" | head -1 > /tmp/url.txt
      - name: Print result
        run: |
          echo "Result URL:"
          cat /tmp/url.txt 2>/dev/null || echo "none"