name = "clipcraft-voice"
main = "src/worker.mjs"
compatibility_date = "2025-01-01"

# DESPLIEGUE (una sola vez):
#   1. npm i -g wrangler  &&  wrangler login
#   2. wrangler secret put ELEVENLABS_API_KEY   # clave de elevenlabs.io
#   3. wrangler secret put GROQ_API_KEY         # clave de console.groq.com
#   4. wrangler deploy
#   5. Copia la URL (https://clipcraft-voice.tu-cuenta.workers.dev) y pégala en
#      public/config.js  →  window.__CLIPCRAFT__.apiBaseUrl
#
# OPCIONAL: restringe CORS a tu web:
#   wrangler secret put ALLOWED_ORIGIN   # p.ej. https://3737631.github.io

[observability]
enabled = true
